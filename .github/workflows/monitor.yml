name: Monitor de passagens

on:
  schedule:
    # A cada hora (00:17, 01:17 ... 23:17). Na prática o GitHub descarta boa parte dos
    # agendamentos em horários de carga, então pedimos muitos para garantir alguns.
    # Cada execução usa uma máquina nova (outro IP) e segue a fila de destinos até
    # terminar ou até detectar bloqueio do Google (destinos_por_execucao no config.json).
    # Repositório público: os minutos do GitHub Actions são ilimitados.
    # Minuto "quebrado" de propósito: nos horários cheios o GitHub atrasa as execuções.
    - cron: "17 * * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch: # cria o botão "Run workflow" para rodar manualmente
    inputs:
      destinos:
        description: "Opcional: códigos IATA separados por espaço (ex.: PMW SCL). Vazio = segue a fila."
        required: false
        default: ""

# O token automático do GitHub precisa de escrita para salvar o historico.json.
permissions:
  contents: write

# Nunca roda duas execuções ao mesmo tempo (evita conflito no histórico).
concurrency:
  group: monitor-passagens
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          # Sempre a versão mais recente da main no momento em que a execução começa.
          # Sem isso, uma execução que ficou na fila usaria o histórico de antes da anterior.
          ref: main

      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Passado por variável de ambiente (e não direto no comando) por segurança.
          DESTINOS: ${{ inputs.destinos }}
        run: python main.py $DESTINOS

      - name: Salvar o histórico no repositório
        # Roda mesmo se o monitor terminar com erro, para não perder alertas já enviados.
        if: success() || failure()
        run: |
          if [ ! -f historico.json ]; then
            echo "Nenhum historico.json gerado nesta execução."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json
          if git diff --cached --quiet; then
            echo "Histórico sem mudanças, nada para salvar."
          else
            git commit -m "Atualiza histórico de alertas"
            git pull --rebase
            git push
          fi